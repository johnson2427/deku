[package]
name = "deku-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
subxt = { version = "0.42", features = ["unstable-light-client", "default"] }
kube = { version = "1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.25", features = ["v1_33"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
